name: Identity service CI
run-name: Identity service CI · ${{ github.ref_name }} · ${{ github.event_name }}
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jenkins:
    name: Run CI in Jenkins
    if: github.ref_type == 'branch'
    runs-on: [self-hosted, Linux, X64, nahuatl-ci]
    timeout-minutes: 100
    steps:
      - name: Load CI observer
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5, Node 24
        with:
          persist-credentials: false
      - name: Start Jenkins pipeline
        id: start
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8, Node 24
        env:
          JENKINS_URL: http://jenkins-controller:8080
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
          BUILD_SHA: ${{ github.sha }}
        with:
          script: |
            await require('./ci/jenkins-github.cjs')({ core, mode: 'start' });
      - name: Follow Jenkins stages and publish CI summary
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8, Node 24
        env:
          JENKINS_URL: http://jenkins-controller:8080
          JENKINS_BROWSER_URL: http://127.0.0.1:8080
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
          BUILD_SHA: ${{ github.sha }}
          JENKINS_BUILD_NUMBER: ${{ steps.start.outputs.build_number }}
        with:
          script: |
            await require('./ci/jenkins-github.cjs')({ core, mode: 'watch' });
